# This is a basic workflow to help you get started with Actions

name: CI
  
# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test_and_doc:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9, 3.13]
    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Getting repository
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Pre-cache matplotlib font (cross-platform)
      run: |
        python -c "import os; os.environ['MPLBACKEND']='Agg'; import matplotlib.pyplot"

    - name: Run AlphaFold3  mapping notebok
      run: |
        python -m pytest tests/afold_prepare_mapping.py --nbval notebooks/AFold3_mapping.ipynb tests/afold_mapping_output.py

    - name: Run AlphaFold3  Alignment notebook
      run: |
        python -m pytest --nbval notebooks/AFold_Alignment_CPU.ipynb tests/afold_alignment_output.py
        
    - name: Run AlphaFold3 Inference notebook
      run: |
        python -m pytest --nbval notebooks/AFold_Diffusion_GPU.ipynb tests/afold_diffusion_output.py

    - name: Run AlphaFold3 Analysis notebook
      run: |  
        python -m pytest tests/afold_prepare_analysis.py --nbval notebooks/AFold_Confidence_Levels.ipynb

    - name: Run Bindcraft notebook
      run: |  
        python -m pytest --nbval  notebooks/bindcraft.ipynb tests/bindcraft_output.py

    - name: Run Boltz Inference notebook
      run: |  
        python -m pytest --nbval tests/boltz_prepare_run.py notebooks/Boltz_w_mmseqs.ipynb tests/boltz_output.py

    - name: Run Boltz Analysis notebook
      run: |  
        python -m pytest tests/boltz_prepare_analysis.py --nbval notebooks/boltz_confidence_levels.ipynb
        
    - name: Run Boltzgen
      run: |  
        python -m pytest --nbval notebooks/boltzgen.ipynb tests/boltzgen_output.py

    - name: Run RFDiffusion
      run: |  
        python -m pytest --nbval  notebooks/RFDiffusion.ipynb tests/rfdiffusion_output.py

  test_md:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Protein with small molecule with smiles
          - input_file: md_inputs/G3_smol_model_0.cif
            boltz_input_file: md_inputs/G3_smol_smi.yaml
          # Protein ion as CCD
          - input_file: md_inputs/G3_ion_model_0.cif
            boltz_input_file: md_inputs/G3_ion.yaml
          # Protein with RNA 
          - input_file: md_inputs/G3_RNA_model_0.cif
            boltz_input_file: md_inputs/G3_RNA.yaml

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          environment-file: environments/molecular_dynamics.yml
          activate-environment: openmm
          auto-activate-base: false

      - name: Install local tool RNAprep
        shell: bash -el {0}
        run: |
          pip install -e tools/RNAprep

      - name: Install local tool ccd2smiles
        shell: bash -el {0}
        run: |
          pip install -e tools/ccd2smiles

      - name: Run ccd2smiles tests
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate openmm
          pytest tools/ccd2smiles/tests

      - name: Patch notebook inputs
        run: |
          sed \
            -e 's|__INPUT_FILE__|${{ matrix.input_file }}|g' \
            -e 's|__BOLTZ_INPUT_FILE__|${{ matrix.boltz_input_file }}|g' \
            notebooks/Molecular_Dynamics.ipynb > notebooks/Molecular_Dynamics_ci.ipynb

      - name: Run MD Notebook
        shell: bash -el {0}
        run: |
          python -m pytest --nbval tests/prepare_md.py notebooks/Molecular_Dynamics_ci.ipynb
          
      - name: Run MD Analysis Notebook
        if: matrix.input_file == 'md_inputs/G3_smol_model_0.cif'
        shell: bash -el {0}
        run: |
          python -m pytest --nbval tests/prepare_md_output.py notebooks/MD_Analysis.ipynb 
    - name: Run PLM-Interact
      run: |  
        python -m pytest --nbval tests/PLM_prepare.py notebooks/PLM-interact.ipynb tests/PLM_output.py 


